# Stages each GitHub release on npm with trusted publishing (OIDC): no token to store, and npm adds provenance on its own.
# A staged version is not public yet: a maintainer approves it with 2FA, on npmjs.com (Staged Packages) or with
# `npm stage approve <id>`. Whoever gets into this repository still cannot publish without you.
#
# One-time setup. npm only lets you set up trusted publishing for a package that already exists,
# so the very first version is published by hand from your computer (npm login, then npm publish).
# Then on npmjs.com: package settings → Trusted Publisher → GitHub Actions, this repository,
# workflow "release.yml". Leave "Allow npm publish" unticked: staging is always allowed.
#
# It can also be started by hand (Actions → Publish to npm → Run workflow), for example after a failed run:
# it stages the version in package.json.
name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Use an npm that can stage packages (11.15 or newer)
        run: npm install -g npm@^11.15.0
      - run: npm ci
      - name: Check that the release tag matches package.json
        if: github.event_name == 'release'
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The release tag is $GITHUB_REF_NAME, but package.json says $version. Make them match (for example v$version)."
            exit 1
          fi
      - name: Stage for approval, unless this version is already on npm
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
            echo "$name@$version is already on npm: nothing to stage."
          else
            npm stage publish --access public
            echo "::notice::$name@$version is staged. Approve it with 2FA on npmjs.com (Staged Packages) or with npm stage approve, and it goes live."
          fi
